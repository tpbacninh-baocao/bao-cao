<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Văn bản đến – Thuế TP Bắc Ninh</title>
<!--
  Trang "Văn bản đến" của app Báo cáo điều hành (đặt cạnh index.html trên GitHub Pages).
  Dữ liệu: van-ban-den.mahoa.json – tác vụ GitHub Actions "Lấy văn bản đến" lấy từ kho riêng tư theo-doi-van-ban
  (xuat/van-ban-den.json), khóa bằng mật khẩu xem (AES-GCM 256, PBKDF2-SHA256). Trang chỉ đọc, giải mã ngay trên máy.
  Không dùng CDN, không gọi dịch vụ ngoài. Chỉ mở link Google Drive/Docs. Văn bản mật chỉ hiện nhãn.
-->
<style>
:root{--bg:#eef3fa;--card:#fff;--card2:#f7f9fd;--border:#dde5f0;--text:#0f1b2d;--muted:#5d6b80;--primary:#1d5bd8;--primary-soft:#e5eeff;
  --good:#15803d;--good-soft:#e3f5e9;--warn:#b45309;--warn-soft:#fdf3dc;--cam:#c2410c;--cam-soft:#ffedd5;--bad:#d92d20;--bad-soft:#fde7e5;
  --tim:#7c3aed;--tim-soft:#ede9fe;--xanh:#0e7490;--xanh-soft:#cffafe;--mat:#4b5563;--mat-soft:#e5e7eb;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 8px 24px rgba(15,27,45,.07);--r:14px}
[data-theme="dark"]{--bg:#0a1220;--card:#121c2e;--card2:#0f1828;--border:#24334d;--text:#e6edf7;--muted:#97a6bd;--primary:#6ea0ff;--primary-soft:#1a2c4f;
  --good:#3fbf6f;--good-soft:#143323;--warn:#f0b13c;--warn-soft:#3a2d10;--cam:#fb923c;--cam-soft:#3b2414;--bad:#f2675c;--bad-soft:#3d1a18;
  --tim:#a78bfa;--tim-soft:#2a1f4a;--xanh:#22d3ee;--xanh-soft:#0f3340;--mat:#cbd5e1;--mat-soft:#273244;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
/* ---------- đầu trang ---------- */
.hero{background:radial-gradient(ellipse at 70% 0,rgba(56,189,248,.35),transparent 55%),linear-gradient(160deg,#04163a,#0b3270 60%,#0a2a5e);color:#e6f3ff;padding:14px 0 18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(125,211,252,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.4) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%)}
.hero>*{position:relative}
.hero-in{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ve{display:inline-block;color:#bae6fd;text-decoration:none;font-size:13px;font-weight:600;border:1px solid rgba(125,211,252,.4);border-radius:9px;padding:4px 10px;margin-bottom:8px}
.ve:hover{background:rgba(125,211,252,.12)}
.hero h1{margin:0;font-size:clamp(22px,3vw,32px);letter-spacing:.04em;background:linear-gradient(90deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .ph{margin:2px 0 0;color:#a9c7e8;font-size:13.5px}
.capnhat{margin:6px 0 0;font-size:12.5px;color:#93c5fd}
.capnhat.cu{color:#fca5a5;font-weight:700}
.dongho{display:flex;align-items:center;gap:12px;border:1px solid rgba(125,211,252,.35);background:rgba(8,30,70,.55);border-radius:14px;padding:8px 12px}
.dongho .g{font-variant-numeric:tabular-nums;line-height:1.15;text-align:right}
.dongho .g small{display:block;font-size:12px;color:#a9c7e8}
.dongho .g b{font-size:24px;color:#fff;text-shadow:0 0 14px rgba(56,189,248,.7)}
.nut-s{border:1px solid rgba(125,211,252,.45);background:rgba(14,58,120,.6);color:#e6f3ff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer}
.nut-s:hover{background:rgba(30,96,180,.75)}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(220px,1.35fr);gap:10px;margin-top:14px}
.k{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid rgba(125,211,252,.28);background:linear-gradient(160deg,rgba(14,58,120,.65),rgba(6,28,66,.6));color:#e6f3ff;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.k:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.25);border-color:rgba(186,230,253,.7)}
.k.on{border-color:#fff;box-shadow:0 0 0 2px var(--kc,#38bdf8) inset,0 0 24px var(--kc,#38bdf8)}
.k .i{font-size:18px;line-height:1}
.k b{font-size:28px;line-height:1.15;color:var(--kc,#fff);text-shadow:0 0 16px var(--kc,rgba(56,189,248,.5));font-variant-numeric:tabular-nums}
.k span{font-size:12.5px;color:#cfe3fa;font-weight:600}
.k small{font-size:11.5px;color:#93b7de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-tron{display:flex;flex-direction:row;align-items:center;gap:10px;cursor:default}
.nut-loc{display:none}.loc-them{display:contents}
.k-tron:hover{transform:none;box-shadow:none}
.k-tron svg{width:86px;height:86px;flex:none}
.k-tron ul{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.k-tron li{display:flex;gap:6px;align-items:center;white-space:nowrap}
.k-tron li i{width:9px;height:9px;border-radius:3px;flex:none}
.k-tron li b{font-size:13px;color:#fff;text-shadow:none;margin-left:auto;padding-left:6px}
/* ---------- thẻ mục ---------- */
.tabs{position:sticky;top:0;z-index:30;display:flex;gap:4px;overflow-x:auto;background:var(--bg);padding:10px 0 0;border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 13px 10px;border-bottom:3px solid transparent;color:var(--muted);font-weight:650;cursor:pointer;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.tab .dem{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:11.5px;text-align:center}
.tab .dem.do{background:var(--bad-soft);color:var(--bad)}
#view{padding:14px 0 70px}
/* ---------- bộ lọc ---------- */
.loc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.loc input,.loc select{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0;max-width:100%}
.loc input[type=search]{flex:1 1 240px}
.loc select{flex:0 1 auto}
.nut{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.nut:hover{border-color:var(--primary);color:var(--primary)}
.nut.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip small{opacity:.75;margin-left:4px}
.dang-loc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 6px 3px 11px;background:var(--primary-soft);color:var(--primary);font-weight:650;font-size:12.5px}
.pill button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}
/* ---------- bố cục danh sách ---------- */
.luoi{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.ben{display:flex;flex-direction:column;gap:12px;position:sticky;top:56px}
.pn{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.pn h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.pn h3 small{font-weight:500;color:var(--muted);font-size:12px}
h2.ngay{font-size:14.5px;margin:16px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--primary);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2.ngay small{color:var(--muted);font-weight:500}
h2.ngay:first-child{margin-top:0}
/* ---------- dòng văn bản ---------- */
.vb{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;border:1px solid var(--border);border-left:5px solid var(--border);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s,transform .12s}
.vb:hover{border-color:var(--primary);transform:translateX(2px)}
.vb.qua-han{border-left-color:var(--bad)}.vb.hom-nay{border-left-color:var(--cam)}.vb.s1-3{border-left-color:var(--warn)}.vb.xa{border-left-color:var(--good)}.vb.mat{border-left-color:var(--mat)}.vb.xong{border-left-color:var(--good)}
.vb-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--primary-soft)}
.vb.qua-han .vb-ic{background:var(--bad-soft)}.vb.mat .vb-ic{background:var(--mat-soft)}
.vb-d1{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.vb-d1 .sk{font-weight:750;color:var(--text);font-size:14px}
.vb-ty{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;font-weight:600;line-height:1.4}
.vb-d3{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.vb-ph{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:1px 7px;font-size:12px;font-weight:650;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.cam{background:var(--cam-soft);color:var(--cam)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.good{background:var(--good-soft);color:var(--good)}
.tag.mat{background:var(--mat-soft);color:var(--mat)}.tag.tim{background:var(--tim-soft);color:var(--tim)}.tag.xanh{background:var(--xanh-soft);color:var(--xanh)}
.tag.vien{background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:600}
.trong{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:200;background:#0b3270;color:#fff;border:1px solid #7dd3fc;border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:650;display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px);animation:vao .25s}
.toast button{border:0;background:#38bdf8;color:#00142e;border-radius:8px;padding:5px 10px;font-weight:800;cursor:pointer;flex:none}
.toast .x{background:rgba(255,255,255,.15);color:#fff}
.tag.moi{background:#ef4444;color:#fff;animation:nhay 1.6s ease-in-out infinite}
@keyframes nhay{50%{opacity:.55}}
.song{display:inline-flex;align-items:center;gap:5px;color:#86efac;font-weight:700;white-space:nowrap}
.song i{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:nhip 1.8s infinite}
@keyframes nhip{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.capnhat a{color:#bae6fd;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.tag.moi,.song i{animation:none}}
.loi{background:var(--card);border:1px solid var(--bad);border-radius:12px;padding:22px;text-align:center;color:var(--bad);margin:20px 0}
/* ---------- biểu đồ nhỏ ---------- */
.bd svg{width:100%;height:auto;display:block}
.bd text{font-family:inherit}
.thanh{display:flex;flex-direction:column;gap:6px}
.thanh button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;border:0;background:none;padding:3px 2px;cursor:pointer;text-align:left;border-radius:8px;font-size:13px}
.thanh button:hover{background:var(--primary-soft)}
.thanh button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thanh button b{font-variant-numeric:tabular-nums}
.thanh button u{grid-column:1/-1;height:6px;border-radius:4px;background:var(--card2);overflow:hidden;text-decoration:none}
.thanh button u i{display:block;height:100%;border-radius:4px;background:var(--c,var(--primary))}
.o-lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.o-lv button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;border:1px solid var(--border);background:var(--card2);border-radius:12px;padding:9px 10px;cursor:pointer;text-align:left}
.o-lv button:hover{border-color:var(--primary)}
.o-lv b{font-size:20px;line-height:1.1}
.o-lv span{font-size:12px;color:var(--muted);line-height:1.3}
/* ---------- hôm nay, ma trận, đơn vị ---------- */
.cot2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cot3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.muc h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px}
.muc h3 .so{margin-left:auto;font-size:13px;color:var(--muted)}
.muc .ds{max-height:520px;overflow:auto;padding-right:2px}
.muc .vb{grid-template-columns:34px minmax(0,1fr) auto;padding:8px 10px}
.muc .vb-ic{width:34px;height:34px;font-size:16px}
.mt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt .o{border-radius:16px;padding:12px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);min-height:180px}
.mt .o h3{margin:0 0 2px;font-size:15px;display:flex;gap:8px;align-items:center}
.mt .o p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.mt .o.q1{border-top:5px solid var(--bad)}.mt .o.q2{border-top:5px solid var(--primary)}.mt .o.q3{border-top:5px solid var(--warn)}.mt .o.q4{border-top:5px solid var(--mat)}
.mt .ds{max-height:420px;overflow:auto}
.mt .vb{grid-template-columns:minmax(0,1fr) auto;padding:7px 10px}
.mt .vb-ic{display:none}
.dv-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dv-the{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.dv-the:hover{border-color:var(--primary)}
.dv-the h4{margin:0;font-size:14.5px}
.dv-the .so4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dv-the .so4 div{background:var(--card2);border-radius:9px;padding:5px 6px;text-align:center}
.dv-the .so4 b{display:block;font-size:18px}
.dv-the .so4 span{font-size:11px;color:var(--muted)}
.dv-the small{color:var(--muted);font-size:12px}
.ghi{font-size:12.5px;color:var(--muted);margin:0 0 12px}
/* ---------- lịch ---------- */
.lich-dau{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lich-dau h3{margin:0 8px;font-size:18px;min-width:150px;text-align:center}
.lich-dau .gian{flex:1}
.lich-luoi{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.thang{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.thang .t{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.ngay-o{min-height:104px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;overflow:hidden}
.ngay-o:hover{border-color:var(--primary)}
.ngay-o.ngoai{opacity:.45}.ngay-o.cn{background:var(--card2)}
.ngay-o.hom{border:2px solid var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.ngay-o.chon{background:var(--primary-soft)}
.ngay-o .s{font-weight:750;font-size:13px;display:flex;justify-content:space-between}
.ngay-o .s em{font-style:normal;font-size:11px;color:var(--primary)}
.sk-l{display:block;font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--xanh-soft);color:var(--xanh)}
.sk-l.han{background:var(--bad-soft);color:var(--bad)}.sk-l.nb{background:var(--warn-soft);color:var(--warn)}
.cham{display:none;gap:3px;flex-wrap:wrap}.cham i{width:7px;height:7px;border-radius:50%;background:var(--xanh)}.cham i.han{background:var(--bad)}.cham i.nb{background:var(--warn)}
.chuong{display:flex;flex-direction:column;gap:10px}
.hop{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;text-align:left;width:100%;border:1px solid var(--border);border-left:5px solid var(--xanh);background:var(--card);border-radius:12px;padding:9px 11px;cursor:pointer;box-shadow:var(--shadow)}
.hop:hover{border-color:var(--primary)}
.hop.qua{opacity:.6;border-left-color:var(--mat)}
.hop .gio{text-align:center;font-weight:800;font-size:16px;color:var(--xanh);line-height:1.2}
.hop .gio small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.hop .nd b{display:block;font-size:13.5px}
.hop .nd span{display:block;font-size:12.5px;color:var(--muted)}
.hop .nd .ty{color:var(--text);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ngay-nhom{font-size:13px;font-weight:750;color:var(--primary);margin:6px 0 -2px;display:flex;gap:6px;align-items:center}
.ngay-nhom.hom:after{content:"HÔM NAY";font-size:10.5px;background:var(--primary);color:#fff;padding:1px 6px;border-radius:5px}
/* ---------- ngăn chi tiết ---------- */
.drawer{position:fixed;inset:0;z-index:100}
.dr-nen{position:absolute;inset:0;background:rgba(2,11,31,.45);animation:mo .2s}
.dr{position:absolute;right:0;top:0;bottom:0;width:min(620px,100%);background:var(--bg);box-shadow:-12px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:vao .25s cubic-bezier(.2,.8,.2,1)}
@keyframes vao{from{transform:translateX(40px)}to{transform:none}}
@keyframes mo{from{opacity:0}}
.dr-dau{padding:14px 16px 12px;background:linear-gradient(160deg,#04163a,#0b3270);color:#e6f3ff;display:flex;gap:10px;align-items:flex-start}
.dr-dau .tt{flex:1;min-width:0}
.dr-dau .sk{font-size:19px;font-weight:800}
.dr-dau .ng{font-size:13px;color:#a9c7e8}
.dr-dau .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.dr-dau button{border:1px solid rgba(125,211,252,.4);background:rgba(14,58,120,.6);color:#fff;border-radius:9px;width:34px;height:34px;cursor:pointer;flex:none}
.dr-than{flex:1;overflow:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.dr-chan{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--card)}
.dr-chan span{font-size:13px;color:var(--muted)}
.ty-lon{font-size:16.5px;font-weight:700;line-height:1.45;margin:0 0 12px}
.hop-the,.han-the{border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.han-the{background:var(--card);border:1px solid var(--border)}

<script>
/* Thư viện dùng chung Văn bản đến (gộp sẵn trong trang, không cần file riêng) */
/* =====================================================================
   VĂN BẢN ĐẾN – THƯ VIỆN DÙNG CHUNG
   Dùng cho trang "Văn bản đến" (van-ban-den.html) và app Báo cáo điều hành (index.html):
   - tách nhiệm vụ từ văn bản đến, tính tình trạng hạn theo hôm nay;
   - quy đổi tên đơn vị chủ trì về mã đơn vị của app (QLDN1…, KT1…, TCS1…);
   - gợi ý việc phải làm theo ngày, lịch công việc trong tuần;
   - thống kê theo đơn vị, nhận định để lãnh đạo chỉ đạo;
   - dựng báo cáo nhanh (in / PDF / Word / văn bản / Excel).
   Không gọi dịch vụ ngoài; chạy hoàn toàn trên máy người xem.
   ===================================================================== */
(function(g){
'use strict';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boDau=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const norm=s=>boDau(s).replace(/\s+/g,' ').trim();

/* ---------- ngày (chuỗi yyyy-mm-dd, theo múi giờ Việt Nam) ---------- */
const homNay=()=>{ try{ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }catch(e){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } };
const dmy=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?m[3]+'/'+m[2]+'/'+m[1]:(s||''); };
const dm=s=>dmy(s).slice(0,5);
const soNgay=(a,b)=>Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000);   // a – b (ngày)
const congNgay=(s,n)=>{ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const thuSo=s=>new Date(s+'T00:00:00Z').getUTCDay();
const THU=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'], THU_N=['CN','T2','T3','T4','T5','T6','T7'];
const thu=s=>THU[thuSo(s)];
const ngayLam=s=>{ const d=thuSo(s); return d!==0&&d!==6; };
function luiNgayLam(s,n){ let d=s, k=0; while(k<n){ d=congNgay(d,-1); if(ngayLam(d)) k++; } return d; }
function ngayLamTruoc(s){ let d=congNgay(s,-1); while(!ngayLam(d)) d=congNgay(d,-1); return d; }
function dauTuan(s){ return congNgay(s,-((thuSo(s)+6)%7)); }          // Thứ Hai
function cuoiTuan(s){ return congNgay(dauTuan(s),6); }                 // Chủ nhật
function kyBaoCao(ma,hom,tu,den){
  hom=hom||homNay();
  if(ma==='hom') return {tu:hom, den:hom, ten:'Ngày '+dmy(hom)};
  if(ma==='mai'){ const m=congNgay(hom,1); return {tu:m, den:m, ten:'Ngày mai '+dmy(m)}; }
  if(ma==='tuan') return {tu:dauTuan(hom), den:cuoiTuan(hom), ten:'Tuần này ('+dm(dauTuan(hom))+' – '+dmy(cuoiTuan(hom))+')'};
  if(ma==='tuantoi'){ const a=congNgay(dauTuan(hom),7); return {tu:a, den:congNgay(a,6), ten:'Tuần tới ('+dm(a)+' – '+dmy(congNgay(a,6))+')'}; }
  if(ma==='7') return {tu:congNgay(hom,-6), den:hom, ten:'7 ngày gần đây ('+dm(congNgay(hom,-6))+' – '+dmy(hom)+')'};
  if(ma==='7toi') return {tu:hom, den:congNgay(hom,6), ten:'7 ngày tới ('+dm(hom)+' – '+dmy(congNgay(hom,6))+')'};
  if(ma==='thang'){ const a=hom.slice(0,8)+'01'; const b=congNgay(congNgay(a,32).slice(0,8)+'01',-1); return {tu:a, den:b, ten:'Tháng '+(+hom.slice(5,7))+'/'+hom.slice(0,4)}; }
  if(ma==='30') return {tu:congNgay(hom,-29), den:hom, ten:'30 ngày gần đây'};
  const a=tu||hom, b=den&&den>=a?den:a; return {tu:a, den:b, ten:a===b?'Ngày '+dmy(a):'Từ '+dmy(a)+' đến '+dmy(b)};
}

/* ---------- đơn vị chủ trì → mã đơn vị của app ---------- */
function maDV(s){
  const n=norm(s).replace(/[\s,.\-_()]/g,''); let m;
  if(!n) return null;
  if((m=n.match(/qldn0?(\d)/))||(m=n.match(/doanhnghiepso0?(\d)/))||(m=n.match(/qlhtdn(?:so)?0?(\d)/))) return ['1','2','3'].includes(m[1])?'QLDN'+m[1]:null;
  if((m=n.match(/^(?:thue)?(?:tcs|coso)0?(\d+)/))||(m=n.match(/thuecoso0?(\d+)/))||(m=n.match(/tcs0?(\d+)/))||(m=n.match(/^(?:thue)?cs0?(\d+)$/))) return +m[1]>=1&&+m[1]<=10?'TCS'+(+m[1]):null;
  if((m=n.match(/kiemtra(?:so)?0?(\d)/))||(m=n.match(/^(?:phong)?kt0?(\d)$/))||(m=n.match(/ktra?(?:so)?0?(\d)/))) return ['1','2'].includes(m[1])?'KT'+m[1]:null;
  if(/cntk|canhankinhdoanh|hokinhdoanh/.test(n)) return 'CNTK';
  if(/tccb|tochuccanbo/.test(n)) return 'TCCB';
  if(/nvdtpc|nghiepvudutoan|dutoanphapche|phapche/.test(n)) return 'NVDTPC';
  if(/qlrr|quanlyruiro/.test(n)) return 'QLRR';
  if(/dlrr|dulieu/.test(n)) return 'DLRR';
  if(/^(?:phong)?vanphong|^vp$/.test(n)) return 'VP';
  return null;
}
const khoaDV=s=>maDV(s)||(s&&String(s).trim()?'X:'+norm(s):'X:chua-phan');
const TEN_DV={QLDN1:'Phòng Quản lý, hỗ trợ doanh nghiệp số 1',QLDN2:'Phòng Quản lý, hỗ trợ doanh nghiệp số 2',QLDN3:'Phòng Quản lý, hỗ trợ doanh nghiệp số 3',
  CNTK:'Phòng CNTK',KT1:'Phòng Kiểm tra 1',KT2:'Phòng Kiểm tra 2'};
Object.assign(TEN_DV,{VP:'Văn phòng',TCCB:'Phòng Tổ chức cán bộ',NVDTPC:'Phòng Nghiệp vụ – Dự toán – Pháp chế',QLRR:'Phòng Quản lý rủi ro',DLRR:'Phòng Dữ liệu và rủi ro'});
for(let i=1;i<=10;i++) TEN_DV['TCS'+i]='Thuế cơ sở '+i+' thành phố Bắc Ninh';
/* ---------- Đơn vị được cấp mật khẩu riêng (giữ khớp với cong-cu/don-vi.mjs – tệp đó đọc chính thư viện này) ---------- */
const DS_PHONG=['VP','QLDN1','QLDN2','QLDN3','CNTK','KT1','KT2','TCCB','NVDTPC','QLRR','DLRR'];
const DS_DON_VI=[...DS_PHONG,...Array.from({length:10},(_,i)=>'TCS'+(i+1))];
/* Đơn vị nêu trong một chuỗi (đơn vị chủ trì, phối hợp, thành phần): hiểu cả “các phòng”, “các Thuế cơ sở”, “các đơn vị” */
function dvLienQuan(s){
  const out=new Set(); const t=norm(s); if(!t) return out;
  if(/(cac|tat ca cac|toan bo cac) don vi|toan the/.test(t)){ DS_DON_VI.forEach(x=>out.add(x)); return out; }
  if(/(cac|tat ca cac|toan bo cac) phong/.test(t)) DS_PHONG.forEach(x=>out.add(x));
  if(/(cac|tat ca cac)? ?thue co so(?! ?\d)|cac tcs\b|cac co so/.test(t)) DS_DON_VI.filter(x=>/^TCS/.test(x)).forEach(x=>out.add(x));
  String(s).split(/[;,\n+]|\s+và\s+/).forEach(p=>{ const m=maDV(p); if(m) out.add(m); });
  return out;
}
/* ---------- Khóa riêng của đơn vị ----------
   khoa_don_vi.json: {lap, salt, ds:[{iv,du}]} – mỗi mục là thông tin một đơn vị (mã, tên, khóa dữ liệu…) khóa bằng mật khẩu đơn vị đó.
   Dữ liệu của đơn vị (don-vi/<MÃ>.*.json) khóa bằng khóa riêng (AES-GCM 256, khóa ngẫu nhiên suy từ “mã gốc” của quản trị). */
const b64d=t=>{ const b=atob(t), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
const b64e=buf=>{ const u=new Uint8Array(buf); let x=''; for(let i=0;i<u.length;i+=0x8000) x+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(x); };
let KHOA_DV_TEP=null;
async function moKhoaDonVi(mk){
  if(!mk||!(window.crypto&&crypto.subtle)) return null;
  if(!KHOA_DV_TEP){ try{ const r=await fetch('khoa_don_vi.json?t='+Date.now(),{cache:'no-store'}); KHOA_DV_TEP=r.ok?await r.json():false; }catch(e){ return null; } }
  const o=KHOA_DV_TEP; if(!o||!Array.isArray(o.ds)) return null;
  const g=await crypto.subtle.importKey('raw',new TextEncoder().encode(mk),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(o.salt),iterations:o.lap||250000,hash:'SHA-256'},g,{name:'AES-GCM',length:256},false,['decrypt']);
  for(const e of o.ds){ try{ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},k,b64d(e.du)); const v=JSON.parse(new TextDecoder().decode(pt)); if(v&&v.ma&&v.khoa) return v; }catch(x){} }
  return null;
}
const coTepKhoaDV=async()=>{ if(KHOA_DV_TEP===null){ try{ const r=await fetch('khoa_don_vi.json?t='+Date.now(),{cache:'no-store'}); KHOA_DV_TEP=r.ok?await r.json():false; }catch(e){ return null; } } return !!(KHOA_DV_TEP&&KHOA_DV_TEP.ds); };
async function giaiMaKhoa(o,khoaB64){
  const k=await crypto.subtle.importKey('raw',b64d(khoaB64),{name:'AES-GCM'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.du)); return JSON.parse(new TextDecoder().decode(pt));
}
async function maHoaKhoa(obj,khoaB64){
  const k=await crypto.subtle.importKey('raw',b64d(khoaB64),{name:'AES-GCM'},false,['encrypt']); const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj))); return {maHoa:'AES-GCM',khoa:'don-vi',iv:b64e(iv),du:b64e(ct)};
}
/* Khóa dữ liệu của đơn vị = HMAC-SHA256(mã gốc, "bao-cao-don-vi|<MÃ>") – trùng cách tính của cong-cu/don-vi.mjs */
async function khoaTuGoc(gocB64,ma){ const k=await crypto.subtle.importKey('raw',b64d(gocB64),{name:'HMAC',hash:'SHA-256'},false,['sign']); return b64e(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode('bao-cao-don-vi|'+ma))); }

/* ---------- chuẩn bị dữ liệu (cùng cách tính với trang Văn bản đến) ---------- */
const laKhan=v=>/khẩn|hỏa tốc/i.test(v.do_khan||'');
const laKhanCao=v=>/thượng khẩn|hỏa tốc/i.test(v.do_khan||'');
function hopCua(v){ const c=v.cuoc_hop; if(!c||!c.thoi_gian) return null; const s=String(c.thoi_gian); let ngay='', gio='';
  let m=/(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/.exec(s);
  if(m){ ngay=m[1]+'-'+m[2]+'-'+m[3]; if(m[4]) gio=m[4].padStart(2,'0')+':'+m[5]; }
  else { m=/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/.exec(s); if(!m) return null; ngay=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    const h=/(\d{1,2})\s*(?:h|giờ|:)\s*(\d{2})?/i.exec(s.replace(m[0],'')); if(h&&+h[1]<24) gio=h[1].padStart(2,'0')+':'+(h[2]||'00'); }
  return {ngay, gio, dd:c.dia_diem||'', ct:c.chu_tri_cuoc_hop||'', tp:c.thanh_phan||''}; }
const soKH=v=>v.so_ky_hieu||(v.so_den?'Số đến '+v.so_den:'(chưa có số)');
function hanChinh(v){ const hs=[]; if(v.han) hs.push(v.han); (v.nhiem_vu||[]).forEach(n=>{ if(n.han) hs.push(n.han); }); hs.sort(); return hs[0]||null; }
function ttHan(han,xong,hom){
  if(xong) return {ma:'xong', nhan:'Hoàn thành', lop:'good'};
  if(!han) return {ma:'khong-han', nhan:'Không nêu hạn', lop:'vien'};
  const c=soNgay(han,hom);
  if(c<0) return {ma:'qua-han', nhan:'Quá hạn '+(-c)+' ngày', c, lop:'bad'};
  if(c===0) return {ma:'hom-nay', nhan:'Hạn hôm nay', c, lop:'cam'};
  if(c<=3) return {ma:'s1-3', nhan:'Còn '+c+' ngày', c, lop:'warn'};
  if(c<=7) return {ma:'tuan', nhan:'Còn '+c+' ngày', c, lop:'xanh'};
  return {ma:'xa', nhan:'Còn '+c+' ngày', c, lop:'good'};
}
function chuanBi(data,hom){
  hom=hom||homNay();
  return (data&&data.van_ban||[]).map((v,i)=>{ const o=Object.assign({},v); o._i=i; o._han=hanChinh(v); o._hop=v.mat?null:hopCua(v); o._khan=!v.mat&&laKhan(v);
    o._dv=v.don_vi_chu_tri||''; o._ma=v.mat?null:khoaDV(v.don_vi_chu_tri); o._t=v.mat?{ma:'mat'}:ttHan(o._han,v.trang_thai==='Hoàn thành',hom); return o; });
}

/* ---------- nhiệm vụ: mỗi văn bản → các việc có hạn; hạn nội bộ chưa ghi thì tính lùi 2 ngày làm việc ---------- */
function dsViec(DS,hom){
  hom=hom||homNay(); const out=[];
  for(const v of DS){
    if(v.mat||v.trang_thai==='Chỉ để biết') continue;   // văn bản chỉ để biết: không giao nhiệm vụ
    const xong=v.trang_thai==='Hoàn thành', deBiet=v.trang_thai==='Chỉ để biết';
    let ls=(v.nhiem_vu||[]).filter(n=>n&&(n.noi_dung||n.han)).map(n=>({nd:n.noi_dung||'Thực hiện nhiệm vụ theo văn bản', han:n.han||null, nb:n.han_noi_bo||null}));
    if(!ls.length&&(v.han||(v.viec_phai_lam||[]).length||(v.noi_dung_bao_cao||[]).length))
      ls=[{nd:(v.viec_phai_lam||[])[0]||((v.noi_dung_bao_cao||[])[0]&&('Báo cáo: '+v.noi_dung_bao_cao[0].noi_dung))||('Tham mưu xử lý văn bản: '+(v.trich_yeu||soKH(v))), han:v.han||null, nb:v.han_noi_bo||null, chung:true}];
    ls.forEach((n,k)=>{
      let nb=n.nb, nbTinh=false; if(!nb&&n.han&&v.han_noi_bo&&n.han===v.han) nb=v.han_noi_bo; if(!nb&&n.han){ nb=luiNgayLam(n.han,2); if(nb<(v.ngay_nhan||'')) nb=n.han; nbTinh=true; }
      const t=ttHan(n.han,xong,hom);
      out.push({id:v._i+'.'+k, v, nd:n.nd, han:n.han, nb, nbTinh, chung:!!n.chung, xong, deBiet, t, ma:v._ma, dv:v._dv, xn:!!v.chu_tri_da_xac_nhan, khan:v._khan, khanCao:laKhanCao(v),
        quaNB:!xong&&nb&&nb<hom&&(!n.han||n.han>=hom)});
    });
  }
  out.forEach(t=>t.diem=diemUuTien(t,hom));
  return out;
}
function dsHop(DS){ return DS.filter(v=>v._hop).map(v=>({v, ngay:v._hop.ngay, gio:v._hop.gio, dd:v._hop.dd, ct:v._hop.ct, tp:v._hop.tp, ma:v._ma, dv:v._dv})).sort((a,b)=>(a.ngay+(a.gio||''))<(b.ngay+(b.gio||''))?-1:1); }
function diemUuTien(t,hom){
  if(t.xong) return 0; let d=0; const c=t.t.c;
  if(t.t.ma==='qua-han') d=100+Math.min(60,-c*3); else if(t.t.ma==='hom-nay') d=92; else if(t.t.ma==='s1-3') d=84-c*4; else if(t.t.ma==='tuan') d=55-c; else if(t.t.ma==='xa') d=25; else d=12;
  if(t.quaNB) d+=8; if(t.nb===hom) d+=10; if(t.khanCao) d+=18; else if(t.khan) d+=8; if(t.deBiet) d-=20; if(!t.ma||/^X:chua/.test(t.ma)) d+=4;
  return Math.max(1,d);
}

/* ---------- gợi ý thực hiện cho một việc ---------- */
function goiY(t,hom){
  hom=hom||homNay(); const v=t.v, a=[];
  if(t.xong) return ['Đã hoàn thành theo Sổ theo dõi.'];
  if(t.t.ma==='qua-han') a.push('⛔ Đã quá hạn '+(-t.t.c)+' ngày: khẩn trương hoàn thành, báo cáo lãnh đạo lý do hoặc xin gia hạn.');
  else if(t.t.ma==='hom-nay') a.push('🟠 Hạn chính thức hôm nay: hoàn thành, trình ký và gửi trong ngày.');
  else if(t.quaNB) a.push('🟡 Đã qua hạn nội bộ ('+dm(t.nb)+'): trình lãnh đạo ngay để kịp hạn '+dm(t.han)+'.');
  else if(t.nb===hom) a.push('🟡 Hôm nay là hạn nội bộ: hoàn thiện kết quả, trình lãnh đạo duyệt.');
  if(t.khanCao) a.push('⚡ Văn bản '+(v.do_khan||'khẩn')+': ưu tiên xử lý ngay trong ngày.');
  (v.viec_phai_lam||[]).slice(0,4).forEach(x=>{ if(x&&x!==t.nd) a.push('• '+x); });
  (v.noi_dung_bao_cao||[]).slice(0,3).forEach(b=>a.push('📝 Báo cáo: '+(b.noi_dung||'')+(b.gui_ai?' – gửi '+b.gui_ai:'')+(b.hinh_thuc?' ('+b.hinh_thuc+')':'')));
  if((v.phoi_hop||[]).length) a.push('🤝 Phối hợp: '+v.phoi_hop.join('; ')+'.');
  if(t.han&&t.t.ma!=='qua-han'&&t.t.ma!=='hom-nay'){
    const bd=ngayBatDau(t,hom);
    a.push('🗓 Triển khai từ '+(bd===hom?'hôm nay':thu(bd)+' '+dm(bd))+'; trình lãnh đạo trước '+thu(t.nb)+' '+dm(t.nb)+(t.nbTinh?' (tính lùi 2 ngày làm việc)':' (hạn nội bộ)')+'; gửi trước '+thu(t.han)+' '+dm(t.han)+'.');
  } else if(!t.han&&!t.deBiet) a.push('🗓 Văn bản không nêu hạn: chủ động lên kế hoạch, báo cáo lãnh đạo khi có kết quả.');
  if(!t.xn) a.push(t.ma&&!/^X:chua/.test(t.ma)?'ℹ Đơn vị chủ trì là dự kiến – chờ Văn phòng xác nhận trên Sổ theo dõi.':'ℹ Chưa phân đơn vị chủ trì – đề nghị Văn phòng trình lãnh đạo phân công.');
  if(v.can_ra_soat) a.push('⚠ Thông tin đang được rà soát – đối chiếu tệp gốc trước khi thực hiện.');
  if(t.deBiet) a.push('📁 Văn bản chủ yếu để biết – nghiên cứu, phổ biến trong đơn vị.');
  return a;
}
function ngayBatDau(t,hom){
  if(!t.nb) return hom;
  let bd=luiNgayLam(t.nb,t.khan?1:3); if(t.v.ngay_nhan&&soNgay(hom,t.v.ngay_nhan)<=1) bd=hom; return bd<hom?hom:bd;
}
/* ---------- lịch việc theo ngày (mốc: triển khai, hạn nội bộ, hạn chính thức, họp) ---------- */
function lichViec(tasks,hops,hom,tu,n){
  hom=hom||homNay(); tu=tu||hom; n=n||7; const den=congNgay(tu,n-1);
  const ngay=Array.from({length:n},(_,i)=>congNgay(tu,i)); const theo={}; ngay.forEach(d=>theo[d]=[]);
  const them=(d,o)=>{ if(theo[d]) theo[d].push(o); };
  for(const t of tasks){ if(t.xong||t.deBiet&&!t.han) continue;
    if(t.t.ma==='qua-han'){ them(hom,{kieu:'qua', t, uu:200+t.diem, text:'Quá hạn '+(-t.t.c)+' ngày – hoàn thành ngay'}); continue; }
    if(t.han) them(t.han,{kieu:'han', t, uu:150+t.diem, text:'Hạn chính thức – gửi kết quả'+((t.v.noi_dung_bao_cao||[])[0]&&t.v.noi_dung_bao_cao[0].gui_ai?' cho '+t.v.noi_dung_bao_cao[0].gui_ai:'')});
    if(t.nb&&t.nb!==t.han&&t.nb>=hom) them(t.nb,{kieu:'nb', t, uu:120+t.diem, text:'Hạn nội bộ – trình lãnh đạo duyệt'});
    else if(t.quaNB) them(hom,{kieu:'nb', t, uu:130+t.diem, text:'Đã qua hạn nội bộ – trình ngay'});
    const bd=ngayBatDau(t,hom); if(bd>=tu&&bd<=den&&bd!==t.nb&&bd!==t.han) them(bd,{kieu:'bd', t, uu:60+t.diem, text:bd===hom&&t.v.ngay_nhan&&soNgay(hom,t.v.ngay_nhan)<=1?'Văn bản mới – nghiên cứu, phân công cán bộ':'Bắt đầu triển khai, dự thảo kết quả'});
    if(!t.han&&t.v.ngay_nhan===hom) them(hom,{kieu:'bd', t, uu:40+t.diem, text:'Văn bản mới – nghiên cứu, lên kế hoạch'});
  }
  for(const h of hops||[]){ if(h.ngay>=tu&&h.ngay<=den) them(h.ngay,{kieu:'hop', h, uu:140, text:'Họp'+(h.gio?' '+h.gio:'')+(h.dd?' tại '+h.dd:'')});
    const tr=ngayLamTruoc(h.ngay); if(tr>=hom&&tr>=tu&&tr<=den) them(tr,{kieu:'cbhop', h, uu:70, text:'Chuẩn bị tài liệu, cử thành phần họp '+thu(h.ngay)+' '+dm(h.ngay)}); }
  return ngay.map(d=>({ngay:d, ds:theo[d].sort((a,b)=>b.uu-a.uu)}));
}

/* ---------- thống kê theo đơn vị chủ trì ---------- */
function tenKhoa(k,dv){ if(!k||k==='X:chua-phan') return 'Chưa phân đơn vị'; if(TEN_DV[k]) return TEN_DV[k]; return dv||k.replace(/^X:/,''); }
function thongKeDV(tasks,hops,hom){
  hom=hom||homNay(); const tuanDen=cuoiTuan(hom); const m={};
  const lay=(k,dv)=>m[k]=m[k]||{ma:k, ten:tenKhoa(k,dv), dv:dv||'', tong:0, dang:0, xong:0, qua:0, hom:0, s3:0, tuan:0, coHan:0, dungHan:0, khan:0, chuaXN:0, hop:0, nbQua:0, diem:0, vb:new Set()};
  for(const t of tasks){ const o=lay(t.ma||'X:chua-phan',t.dv); o.tong++; o.vb.add(t.v._i);
    if(t.xong) o.xong++; else { o.dang++; o.diem+=t.diem; }
    if(t.han){ o.coHan++; if(t.t.ma!=='qua-han') o.dungHan++; }
    if(t.t.ma==='qua-han') o.qua++; else if(t.t.ma==='hom-nay') o.hom++; else if(t.t.ma==='s1-3') o.s3++;
    if(!t.xong&&t.han&&t.han>=hom&&t.han<=tuanDen) o.tuan++;
    if(!t.xong&&t.khan) o.khan++; if(!t.xn) o.chuaXN++; if(t.quaNB) o.nbQua++; }
  for(const h of hops||[]){ if(h.ngay<hom) continue; const o=lay(h.ma||'X:chua-phan',h.dv); o.hop++; }
  return Object.values(m).map(o=>{ o.soVB=o.vb.size; delete o.vb; o.tlDung=o.coHan?o.dungHan/o.coHan:null;
    o.muc=o.qua>0?'bad':(o.hom+o.s3+o.nbQua)>0?'warn':o.dang>0?'info':'good'; return o; })
    .sort((a,b)=>(a.ma==='X:chua-phan')-(b.ma==='X:chua-phan')||b.qua-a.qua||(b.hom+b.s3)-(a.hom+a.s3)||b.dang-a.dang);
}

/* ---------- nhận định nhanh cho lãnh đạo ---------- */
function nhanDinh(DS,tasks,hops,hom){
  hom=hom||homNay(); const out=[]; const mai=congNgay(hom,1);
  const tk=thongKeDV(tasks,hops,hom); const mo=tasks.filter(t=>!t.xong);
  const qua=mo.filter(t=>t.t.ma==='qua-han'), hn=mo.filter(t=>t.t.ma==='hom-nay'), s3=mo.filter(t=>t.t.ma==='s1-3');
  if(qua.length){ const dvq=tk.filter(o=>o.qua).slice(0,4).map(o=>o.ten+' ('+o.qua+')').join(', ');
    out.push({lv:'bad', t:'<b>'+qua.length+' nhiệm vụ đã quá hạn</b>'+(dvq?' – tập trung ở: '+esc(dvq):'')+'. Đề nghị lãnh đạo đôn đốc, yêu cầu báo cáo lý do và thời gian hoàn thành.'}); }
  if(hn.length) out.push({lv:'warn', t:'<b>'+hn.length+' nhiệm vụ đến hạn hôm nay</b> – kiểm tra tiến độ trình ký trước 16h00.'});
  if(s3.length) out.push({lv:'warn', t:'<b>'+s3.length+' nhiệm vụ đến hạn trong 1–3 ngày tới</b> – các đơn vị cần trình lãnh đạo theo hạn nội bộ.'});
  const nbHom=mo.filter(t=>t.nb===hom&&t.t.ma!=='hom-nay'&&t.t.ma!=='qua-han').length; if(nbHom) out.push({lv:'info', t:'<b>'+nbHom+' nhiệm vụ có hạn nội bộ hôm nay</b> – lãnh đạo dự kiến nhận dự thảo để duyệt.'});
  const khan=mo.filter(t=>t.khanCao).length; if(khan) out.push({lv:'bad', t:'<b>'+khan+' nhiệm vụ thượng khẩn / hỏa tốc</b> chưa hoàn thành – ưu tiên xử lý ngay.'});
  const hopMai=(hops||[]).filter(h=>h.ngay===hom||h.ngay===mai); if(hopMai.length) out.push({lv:'info', t:'<b>'+hopMai.length+' cuộc họp hôm nay và ngày mai</b> – kiểm tra thành phần dự, tài liệu chuẩn bị.'});
  const chuaPhan=DS.filter(v=>!v.mat&&!v.don_vi_chu_tri&&v.trang_thai!=='Chỉ để biết'&&v.trang_thai!=='Hoàn thành').length; if(chuaPhan) out.push({lv:'warn', t:'<b>'+chuaPhan+' văn bản chưa phân đơn vị chủ trì</b> – Văn phòng trình lãnh đạo phân công trong ngày.'});
  const chuaXN=DS.filter(v=>!v.mat&&v.don_vi_chu_tri&&!v.chu_tri_da_xac_nhan&&v.trang_thai!=='Hoàn thành').length; if(chuaXN) out.push({lv:'info', t:'<b>'+chuaXN+' văn bản có đơn vị chủ trì dự kiến</b>, chưa xác nhận trên Sổ theo dõi.'});
  const nhan=DS.filter(v=>v.ngay_nhan===hom).length; if(nhan) out.push({lv:'info', t:'Hôm nay nhận <b>'+nhan+' văn bản</b>'+(DS.filter(v=>v.ngay_nhan===hom&&v._khan).length?', trong đó '+DS.filter(v=>v.ngay_nhan===hom&&v._khan).length+' văn bản khẩn':'')+'.'});
  // ngày dồn nhiều hạn trong 7 ngày tới
  const dem={}; mo.forEach(t=>{ if(t.han&&t.han>hom&&soNgay(t.han,hom)<=7) dem[t.han]=(dem[t.han]||0)+1; });
  const dinh=Object.entries(dem).sort((a,b)=>b[1]-a[1])[0]; if(dinh&&dinh[1]>=3) out.push({lv:'info', t:'Hạn dồn nhiều vào <b>'+thu(dinh[0])+' '+dmy(dinh[0])+'</b> ('+dinh[1]+' nhiệm vụ) – nên nhắc các đơn vị chủ động hoàn thành sớm.'});
  const tai=tk.filter(o=>o.ma!=='X:chua-phan'&&o.dang>0).sort((a,b)=>b.diem-a.diem)[0]; if(tai&&tai.dang>=5) out.push({lv:'info', t:'Đơn vị nhiều việc nhất: <b>'+esc(tai.ten)+'</b> – '+tai.dang+' nhiệm vụ đang xử lý'+(tai.qua?', '+tai.qua+' quá hạn':'')+'.'});

}

const MAU_LOP={bad:'#d92d20',cam:'#c2410c',warn:'#b45309',good:'#15803d',xanh:'#0e7490',vien:'#5d6b80',info:'#1d5bd8'};
const tagIn=t=>'<span style="color:'+(MAU_LOP[t.lop]||'#333')+';font-weight:700">'+esc(t.nhan||'')+'</span>';
const LOAI_BC={
  tonghop:'Báo cáo tổng hợp điều hành văn bản đến',
  giaoviec:'Phiếu theo dõi, đôn đốc nhiệm vụ',
  ngay:'Báo cáo công việc trong ngày',
  tuan:'Kế hoạch công việc trong tuần'

/* opts: {loai, ky:{tu,den,ten}, dv:''|khóa đơn vị|'*' (mỗi đơn vị một phiếu), DS, hom, nguoiLap, capNhat} → {html, text, csv:[[...]]} */
function baoCao(opts){
  const hom=opts.hom||homNay(), ky=opts.ky||kyBaoCao('tuan',hom), DS=opts.DS||[], loai=opts.loai||'tonghop';
  const tasks=opts.tasks||dsViec(DS,hom), hops=opts.hops||dsHop(DS);
  const trong=d=>d&&d>=ky.tu&&d<=ky.den;
  const tk=thongKeDV(tasks,hops,hom);
  let dvs=[null];
  if(opts.dv==='*') dvs=tk.filter(o=>o.dang>0||o.hop>0).map(o=>o.ma);
  else if(opts.dv) dvs=[opts.dv];
  const phan=[], text=[], csv=[['Đơn vị chủ trì','Số ký hiệu','Số đến','Nơi gửi','Ngày nhận','Trích yếu','Nhiệm vụ','Hạn nội bộ','Hạn chính thức','Tình trạng','Gợi ý thực hiện']];
  dvs.forEach((dv,ix)=>{ const r=mucBaoCao({loai,ky,dv,DS,tasks,hops,hom,trong,tk,opts}); phan.push((ix?'<div style="page-break-before:always;break-before:page"></div>':'')+r.html); text.push(r.text); r.csv.forEach(x=>csv.push(x)); });
  return {html:phan.join(''), text:text.join('\n\n────────────\n\n'), csv, ten:LOAI_BC[loai]||'Báo cáo'};
}
function dauVanBan(tieu,phu,hom,kinhGui){

function b64d(t){ const b=atob(t), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function giaiMa(o,mk){
  if(!(window.crypto&&crypto.subtle)) throw new Error('Trình duyệt này không hỗ trợ mã hóa – hãy mở bằng Chrome/Edge/Safari qua đường link https.');

}

    const g=/(\d{1,2})\s*(?:h|giờ|:)\s*(\d{2})?/i.exec(s.replace(m[0],'')); if(g&&+g[1]<24) gio=g[1].padStart(2,'0')+':'+(g[2]||'00'); }

function suKien(kieu){
  const ev=[];

  else DS.forEach(v=>{ if(v.mat||v._t.ma==='xong') return;
    const hs=new Set([v.han,...(v.nhiem_vu||[]).map(n=>n.han)].filter(Boolean)), nb=new Set([v.han_noi_bo,...(v.nhiem_vu||[]).map(n=>n.han_noi_bo)].filter(Boolean));
    hs.forEach(n=>ev.push({ngay:n, lop:'han', nhan:'Hạn: '+soKH(v), v})); nb.forEach(n=>ev.push({ngay:n, lop:'nb', nhan:'Nội bộ: '+soKH(v), v})); });
  return ev.sort((a,b)=>(a.ngay+(a.gio||''))<(b.ngay+(b.gio||''))?-1:1);
}

/* ---------- 5. Ma trận ưu tiên ---------- */
function veMT(){
  const con=DS.filter(v=>!v.mat&&v._t.ma!=='xong');
  const gap=v=>v._t.ma==='qua-han'||v._t.ma==='hom-nay'||v._t.ma==='s1-3'||laKhanCao(v)||(v._hop&&soNgay(v._hop.ngay,HOM)>=0&&soNgay(v._hop.ngay,HOM)<=2);
  const qt=v=>v.trang_thai!=='Chỉ để biết'&&(coViec(v)||!!v._hop);
  const q=[con.filter(v=>gap(v)&&qt(v)),con.filter(v=>!gap(v)&&qt(v)),con.filter(v=>gap(v)&&!qt(v)),con.filter(v=>!gap(v)&&!qt(v))];
  q.forEach(a=>a.sort((x,y)=>(x._t.han||x._hop&&x._hop.ngay||'9999')<(y._t.han||y._hop&&y._hop.ngay||'9999')?-1:1));
  DR.ds=[].concat(...q);
  const o=(i,ic,t,p)=>'<div class="o q'+(i+1)+'"><h3>'+ic+' '+t+' <span class="tag '+['bad','','warn','mat'][i]+'">'+q[i].length+'</span></h3><p>'+p+'</p><div class="ds">'+(q[i].length?q[i].map(v=>dongVB(v,true)).join(''):'<div class="trong" style="padding:12px">Không có.</div>')+'</div></div>';
  return '<p class="ghi">Gấp = quá hạn, hạn trong 3 ngày, thượng khẩn/hỏa tốc hoặc họp trong 2 ngày. Quan trọng = có nhiệm vụ, hạn, việc phải làm, nội dung phải báo cáo hoặc cuộc họp. Không tính văn bản mật, đã hoàn thành.</p><div class="mt">'+
    o(0,'🔥','Làm ngay','Gấp và quan trọng – lãnh đạo cần đôn đốc')+o(1,'📌','Lên kế hoạch','Quan trọng, chưa gấp – giao việc, theo dõi hạn')+o(2,'⚡','Xử lý nhanh','Gấp nhưng chủ yếu để biết – xem, chuyển nhanh')+o(3,'📁','Để biết','Không gấp, không có việc phải làm')+'</div>';
}

/* ---------- 6. Theo đơn vị ---------- */
function veDV(){

/* ---------- tải, mở khóa ---------- */
function hienLoi(m){ $('#tb').classList.remove('hidden'); $('#tb').innerHTML='<div class="loi">'+esc(m)+'</div>'; $('#nd').classList.add('hidden'); $('#khoa').classList.add('hidden'); }
// nen = kiểm tra ngầm (không che màn hình khi lỗi); bao = báo cả khi không có gì mới (bấm “Làm mới”)
let DV=null;   // đơn vị đang đăng nhập bằng mật khẩu đơn vị (chỉ thấy văn bản chủ trì, phối hợp)
async function tai(nen,bao){
  if(!DATA&&!nen){ $('#tb').classList.remove('hidden'); $('#tb').innerHTML='<div class="trong" style="margin-top:20px">Đang tải…</div>'; }
  let o, raw;
  try{ const r=await fetch((DV?'don-vi/'+encodeURIComponent(DV.ma)+'.vbd.json':TEP)+'?t='+Date.now(),{cache:'no-store'});
    if(nen&&!r.ok){ if(bao) thongBao('Chưa lấy được dữ liệu (mã lỗi '+r.status+'). Thử lại sau.'); return; }
    if(r.status===404) return hienLoi('Chưa có dữ liệu văn bản đến. Tác vụ lấy dữ liệu chưa chạy lần nào – nhờ quản trị chạy “Lấy văn bản đến” trong mục Actions của kho.');
    if(!r.ok) return hienLoi('Không tải được dữ liệu (mã lỗi '+r.status+'). Hãy thử lại sau.');
    raw=await r.text(); o=JSON.parse(raw); DONG_BO=r.headers.get('last-modified')||DONG_BO;
  }catch(e){ if(nen){ if(bao) thongBao('Không kết nối được. Kiểm tra mạng rồi thử lại.'); return; } return hienLoi('Không tải được dữ liệu. Kiểm tra mạng rồi bấm “Làm mới”.'); }
  lanKT=Date.now();
  if(DATA&&raw===RAW){ veDau(); if(bao) thongBao('✔ Đã là dữ liệu mới nhất (quét lúc '+esc(gioVN(DATA.cap_nhat_luc))+').',4000); return; }
  if(DV){ try{ return void napDuLieu(await VBDC.giaiMaKhoa(o,DV.khoa),MK,false,raw); }catch(e){ return nen?undefined:hienLoi('Không mở được văn bản của đơn vị.'); } }
  const cu=[MK,ssGet(XEM_SS),ls(XEM_KEY)]; try{ cu.push((JSON.parse(ls(BM_KEY)||'{}')||{}).mkXem); }catch(e){}
  for(const mk of cu){ if(mk&&await thuMo(o,mk,false,raw)) return; }
  for(const mk of cu){ if(mk&&await thuDonVi(mk,false)) return; }
  hoiMK(o,raw);
}
/* Mật khẩu đơn vị: mở khóa thông tin đơn vị (khoa_don_vi.json) rồi tải văn bản của riêng đơn vị */
async function thuDonVi(mk,nho){
  let v=null; try{ v=await VBDC.moKhoaDonVi(mk); }catch(e){} if(!v) return false;

    if(!r.ok){ hienLoi(r.status===404?'Chưa có văn bản đến của '+(v.ten||v.ma)+'. Quản trị cần đặt mã gốc đơn vị (secret MA_GOC_DON_VI) rồi chạy “Lấy văn bản đến”.':'Không tải được dữ liệu (mã lỗi '+r.status+').'); return true; }
    const raw=await r.text(); napDuLieu(await VBDC.giaiMaKhoa(JSON.parse(raw),v.khoa),mk,nho,raw); return true; }
  catch(e){ hienLoi('Không mở được văn bản đến của đơn vị.'); return true; }

async function thuMo(o,mk,nho,raw){

function napDuLieu(d,mk,nho,raw){
  try{
    if(!d||!Array.isArray(d.van_ban)) throw new Error('Dữ liệu không đúng khuôn dạng.');
    if(d.phien_ban>1){ hienLoi('Dữ liệu có khuôn dạng mới hơn trang này hiểu (phiên bản '+d.phien_ban+'). Cần cập nhật trang “Văn bản đến”.'); return true; }
    const truoc=DATA; DATA=d; MK=mk; RAW=raw||RAW; if(nho) lsSet(XEM_KEY,mk); ssSet(XEM_SS,mk);
    // văn bản mới: chưa có ở lần xem trước (lưu trên máy) hoặc vừa về trong lúc đang mở trang
    let daThay=null; try{ daThay=JSON.parse(ls(THAY_KEY)||'null'); }catch(e){}
    const moiVe=truoc?d.van_ban.filter(v=>!new Set(truoc.van_ban.map(khoaVB)).has(khoaVB(v))):[];
    if(!truoc&&Array.isArray(daThay)){ const s0=new Set(daThay); d.van_ban.forEach(v=>{ if(!s0.has(khoaVB(v))) MOI.add(khoaVB(v)); }); }
    moiVe.forEach(v=>MOI.add(khoaVB(v)));
    lsSet(THAY_KEY,JSON.stringify(d.van_ban.map(khoaVB)));
    $('#tb').classList.add('hidden'); $('#khoa').classList.add('hidden'); $('#nd').classList.remove('hidden');
    chuanBi(); veDau(); ve();
    if(!truoc){ const m=/#vb=([^&]+)/.exec(location.hash); if(m){ const k=decodeURIComponent(m[1]); const v=DS.find(x=>String(x.so_den)===k); if(v) moCT(v._i); }
      const md=/#dv=([^&]+)/.exec(location.hash); if(md){ F.ma=decodeURIComponent(md[1]); UI.tab='ds'; ve(); }
      const mt=/#tab=(\w+)/.exec(location.hash); if(mt&&TABS.some(x=>x[0]===mt[1])){ UI.tab=mt[1]; ve(); } }
    else if(moiVe.length) thongBao('🔔 Có <b>'+moiVe.length+'</b> văn bản mới: '+esc(moiVe.slice(0,3).map(v=>v.so_ky_hieu||('số đến '+v.so_den)).join(', '))+(moiVe.length>3?'…':'')+' <button data-xemmoi>Xem</button><button class="x" data-tatbao>✕</button>',15000);
    else thongBao('↻ Dữ liệu vừa được cập nhật (quét lúc '+esc(gioVN(d.cap_nhat_luc))+').',5000);
    return true;
  }catch(e){ hienLoi(e.message); return true; }
}
let hTB=null; function thongBao(h,ms){ const t=$('#toast'); t.innerHTML=h; t.classList.remove('hidden'); clearTimeout(hTB); hTB=setTimeout(()=>t.classList.add('hidden'),ms||6000); }
function linkQuanTri(){ const h=location.hostname; if(!/\.github\.io$/.test(h)) return ''; const chu=h.split('.')[0]; const seg=location.pathname.split('/').filter(Boolean);
  const kho=seg.length&&!/\.html?$/.test(seg[0])?seg[0]:h; return 'https://github.com/'+encodeURIComponent(chu)+'/'+encodeURIComponent(kho)+'/actions/workflows/lay-van-ban-den.yml'; }

  const xong=async()=>{ const v=$('#mk').value; if(!v){ $('#khoaLoi').textContent='Hãy nhập mật khẩu.'; return; }
    $('#bMo').disabled=true; $('#khoaLoi').textContent='Đang mở khóa…'; const ok=await thuMo(o,v,$('#nho').checked,raw)||await thuDonVi(v,$('#nho').checked); $('#bMo').disabled=false;

  $('#bMo').onclick=xong; $('#mk').onkeydown=e=>{ if(e.key==='Enter') xong(); };
}
