name: Lấy văn bản đến

# Lấy tệp văn bản đến từ kho riêng tư (đọc bằng mã chỉ đọc), mã hóa bằng mật khẩu xem,
# rồi ghi van-ban-den.mahoa.json vào kho này để trang "Văn bản đến" đọc.
on:
  schedule:
    # Dự phòng: kho theo-doi-van-ban gọi ngay tác vụ này sau mỗi lần quét (9:40, 12:40, 16:40 giờ Việt Nam)
    - cron: '10 3 * * *'    # 10:10 giờ Việt Nam
    - cron: '10 6 * * *'    # 13:10 giờ Việt Nam
    - cron: '10 10 * * *'   # 17:10 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lay-van-ban-den
  cancel-in-progress: false

jobs:
  lay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tải văn bản đến từ kho riêng tư
        env:
          VANBAN_TOKEN: ${{ secrets.VANBAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VANBAN_TOKEN" || { echo "Chưa đặt secret VANBAN_TOKEN"; exit 1; }
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $VANBAN_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/van-ban-den.json" \
            "https://api.github.com/repos/ndvietbni-blip/theo-doi-van-ban/contents/xuat/van-ban-den.json?ref=main"

      - name: Mã hóa
        env:
          MAT_KHAU_XEM: ${{ secrets.MAT_KHAU_XEM }}
        run: node cong-cu/ma-hoa-van-ban-den.mjs "$RUNNER_TEMP/van-ban-den.json" van-ban-den.mahoa.json

      - name: Gói văn bản cho từng đơn vị (mật khẩu đơn vị)
        env:
          MA_GOC_DON_VI: ${{ secrets.MA_GOC_DON_VI }}
        run: node cong-cu/goi-van-ban-don-vi.mjs "$RUNNER_TEMP/van-ban-den.json" don-vi

      - name: Lưu vào kho nếu có thay đổi
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add van-ban-den.mahoa.json
          if [ -d don-vi ]; then git add don-vi; fi
          if git diff --cached --quiet; then echo "Không có thay đổi."; exit 0; fi
          git commit -m "Cập nhật văn bản đến"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i*3)); done
          exit 1
